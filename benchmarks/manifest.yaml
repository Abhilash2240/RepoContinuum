version: "1.0"
benchmark_id: "repocontinuum_long_horizon_v1"
description: "Reproducible evaluation corpus for long-horizon multi-task repository maintenance."
created_at: "2026-11-21T21:00:00Z"
license: "MIT"
default_repository: "repocontinuum-bench/benchmark-fixtures"
default_base_commit_sha: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0"

chains:
  - chain_id: "chn-01-calc-precision"
    title: "Arbitrary-Precision Financial Math & Formatting"
    description: "Series of dependent tasks updating currency calculation, rounding modes, and tabular receipt formatting."
    base_commit_sha: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0"
    tasks:
      - task_id: "t1-calc-decimal"
        title: "Migrate float calculations to Decimal"
        description: "Replace standard IEEE-754 binary floats with Decimal arithmetic in financial_math.py."
        predecessor_ids: []
        acceptance_criteria:
          - "Decimal precision test suite passes"
          - "Zero floating-point rounding epsilon"
        verifier_ref: "tests/bench/test_math.py:test_decimal_precision"
        expected_changed_files: ["src/calculator/financial_math.py"]
        active_obligations: ["ob-t1-precision"]
        impacted_test_labels: ["test_decimal_precision", "test_overflow"]
        characteristics: ["independent", "precision_critical"]
      - task_id: "t2-calc-rounding"
        title: "Add banker rounding support"
        description: "Implement ROUND_HALF_EVEN rounding strategy based on Decimal context."
        predecessor_ids: ["t1-calc-decimal"]
        acceptance_criteria:
          - "Bankers rounding satisfies monetary standard"
          - "Preserves decimal precision from task 1"
        verifier_ref: "tests/bench/test_math.py:test_bankers_rounding"
        expected_changed_files: ["src/calculator/rounding.py"]
        active_obligations: ["ob-t2-rounding"]
        impacted_test_labels: ["test_bankers_rounding", "test_decimal_precision"]
        characteristics: ["strongly_dependent", "regression_sensitive"]
      - task_id: "t3-calc-format"
        title: "Format localized receipt currency"
        description: "Format Decimal outputs using locale-specific grouping and currency symbols."
        predecessor_ids: ["t2-calc-rounding"]
        acceptance_criteria:
          - "Currency rendered with correct symbol and decimal commas/points"
          - "Rounding from task 2 must not be overridden"
        verifier_ref: "tests/bench/test_math.py:test_currency_formatting"
        expected_changed_files: ["src/calculator/formatters.py"]
        active_obligations: ["ob-t3-format"]
        impacted_test_labels: ["test_currency_formatting", "test_bankers_rounding"]
        characteristics: ["strongly_dependent", "regression_sensitive"]

  - chain_id: "chn-02-auth-tokens"
