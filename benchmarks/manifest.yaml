    tasks:
      - task_id: "t1-auth-signature"
        title: "Enforce RS256 token verification"
        description: "Reject HS256 and None algorithm tokens; require public key RS256 signature verification."
        predecessor_ids: []
        acceptance_criteria:
          - "HS256 tokens rejected with 401 Unauthorized"
          - "Valid RS256 token correctly decoded"
        verifier_ref: "tests/bench/test_auth.py:test_rs256_verification"
        expected_changed_files: ["src/auth/jwt_validator.py"]
        active_obligations: ["ob-t1-rs256"]
        impacted_test_labels: ["test_rs256_verification", "test_token_tampering"]
        characteristics: ["security_critical"]
      - task_id: "t2-auth-rotation"
        title: "Implement refresh token rotation"
        description: "Issue single-use refresh tokens that invalidate previous tokens upon exchange."
        predecessor_ids: ["t1-auth-signature"]
        acceptance_criteria:
          - "Reuse of previous refresh token revokes all child tokens"
          - "RS256 access token verification remains strict"
        verifier_ref: "tests/bench/test_auth.py:test_refresh_rotation"
        expected_changed_files: ["src/auth/refresh_service.py"]
        active_obligations: ["ob-t2-rotation"]
        impacted_test_labels: ["test_refresh_rotation", "test_rs256_verification"]
        characteristics: ["strongly_dependent", "regression_sensitive"]

